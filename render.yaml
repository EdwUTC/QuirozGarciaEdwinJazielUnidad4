# ============================================================
#  Blueprint de Render: crea las dos instancias de la
#  aplicación con una sola operación.
#
#  Cómo usarlo:
#    1. Entra a render.com con tu cuenta de GitHub.
#    2. New → Blueprint.
#    3. Elige el repositorio QuirozGarciaEdwinJazielUnidad4.
#    4. Render lee este archivo y pide los valores marcados
#       con `sync: false`.
#
#  La base de datos se toma de DATABASE_URL (la entrega Neon).
#  La aplicación prefiere esa variable sobre las DB_* sueltas.
# ============================================================

services:
  - type: web
    name: rayito-app-1
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: node app.js
    healthCheckPath: /api/estado
    envVars:
      - key: NODE_ENV
        value: production
      - key: INSTANCE_ID
        value: app-1
      - key: TRUST_PROXY
        value: "2"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false

  - type: web
    name: rayito-app-2
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: node app.js
    healthCheckPath: /api/estado
    envVars:
      - key: NODE_ENV
        value: production
      - key: INSTANCE_ID
        value: app-2
      - key: TRUST_PROXY
        value: "2"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false

# ============================================================
#  Blueprint de Render: crea las dos instancias de la
#  aplicación con una sola operación.
#
#  Cómo usarlo:
#    1. Entra a render.com con tu cuenta de GitHub.
#    2. New → Blueprint.
#    3. Elige el repositorio QuirozGarciaEdwinJazielUnidad4.
#    4. Render lee este archivo y pide los valores marcados
#       con `sync: false` (los de la base de datos).
# ============================================================

services:
  - type: web
    name: rayito-app-1
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: node app.js
    healthCheckPath: /api/estado
    envVars:
      - key: NODE_ENV
        value: production
      - key: INSTANCE_ID
        value: app-1
      - key: TRUST_PROXY
        value: "2"
      - key: DB_SSL
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PUERTO
        sync: false
      - key: DB_NOMBRE
        sync: false
      - key: DB_USUARIO
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false

  - type: web
    name: rayito-app-2
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: node app.js
    healthCheckPath: /api/estado
    envVars:
      - key: NODE_ENV
        value: production
      - key: INSTANCE_ID
        value: app-2
      - key: TRUST_PROXY
        value: "2"
      - key: DB_SSL
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PUERTO
        sync: false
      - key: DB_NOMBRE
        sync: false
      - key: DB_USUARIO
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false

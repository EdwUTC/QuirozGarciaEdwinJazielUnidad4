# ============================================================
#  Blueprint de Render: crea las dos instancias de la
#  aplicación con una sola operación.
#
#  Los secretos compartidos viven en un grupo de variables
#  (DATABASE_URL, llaves del captcha y SESSION_SECRET): se
#  capturan una sola vez y ambos servicios los heredan.
#
#  SESSION_SECRET debe ser el mismo en las dos instancias: con
#  secretos distintos, la cookie firmada por una no la puede
#  validar la otra y el usuario pierde la sesión.
# ============================================================

envVarGroups:
  - name: rayito-secretos
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      # Debe ser el MISMO en todas las instancias: con secretos distintos,
      # la cookie firmada por una no la puede validar la otra.
      - key: SESSION_SECRET
        sync: false

services:
  - type: web
    name: rayito-app-1
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: node app.js
    healthCheckPath: /api/estado
    envVars:
      - fromGroup: rayito-secretos
      - key: NODE_ENV
        value: production
      - key: INSTANCE_ID
        value: app-1
      - key: TRUST_PROXY
        value: "2"

  - type: web
    name: rayito-app-2
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: node app.js
    healthCheckPath: /api/estado
    envVars:
      - fromGroup: rayito-secretos
      - key: NODE_ENV
        value: production
      - key: INSTANCE_ID
        value: app-2
      - key: TRUST_PROXY
        value: "2"

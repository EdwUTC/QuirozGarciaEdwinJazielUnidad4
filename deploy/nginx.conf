# Balanceo de cargas entre las dos instancias de la aplicación.
# Round-robin por defecto: si una instancia falla, nginx la saca
# de la rotación durante 15 segundos.

upstream rayito_app {
    server app1:3000 max_fails=3 fail_timeout=15s;
    server app2:3000 max_fails=3 fail_timeout=15s;

    # Reutiliza conexiones hacia las instancias.
    keepalive 32;
}

# Conserva el protocolo original si hay un balanceador delante
# que ya terminó el TLS; si no, usa el de esta conexión.
map $http_x_forwarded_proto $protocolo_cliente {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    # No revelar la versión de nginx.
    server_tokens off;

    location / {
        proxy_pass http://rayito_app;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $protocolo_cliente;

        proxy_read_timeout 60s;
    }
}
